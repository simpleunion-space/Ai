# Optional Gitea control plane. It is deployed only when an installation opts
# in. The official rootless image uses Gitea's built-in SSH server; it needs no
# host OpenSSH integration and no Docker socket.
#
# Gitea and PostgreSQL both run as ai-stand's unprivileged service identity.
# The host directories must be provisioned as 10000:20000 before deployment.

services:
  gitea-postgresql:
    image: ${GITEA_POSTGRES_IMAGE:-docker.io/library/postgres:18.6-alpine}
    user: "10000:20000"
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD_FILE: /run/secrets/ai-stand-gitea-postgres-password
      TZ: "${IM_TZ:?IM_TZ is required}"
    secrets:
      - source: ai-stand-gitea-postgres-password
        target: ai-stand-gitea-postgres-password
        uid: "10000"
        gid: "20000"
        mode: 0400
    volumes:
      # PostgreSQL 18 uses a version-specific data directory below this path.
      - type: bind
        source: ${STORAGE_ROOT:?STORAGE_ROOT is required}/gitea-data/gitea/postgres
        target: /var/lib/postgresql
    networks:
      ai-gitea-control:
        aliases:
          - gitea-postgresql
          - gitea-db
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gitea -d gitea
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.ai-stand.gitea == true
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 5m
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        monitor: 5m
        order: stop-first

  gitea:
    # Must be a version-pinned official `-rootless` image. The rootless and
    # rootful data layouts are not interchangeable.
    image: ${GITEA_IMAGE:?GITEA_IMAGE is required}
    user: "10000:20000"
    environment:
      GITEA_RUN_MODE: prod
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-postgresql:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/secrets/ai-stand-gitea-postgres-password
      GITEA__database__SSL_MODE: disable
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__PROTOCOL: http
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DOMAIN: ${GITEA_HOST:-gitea.local}
      GITEA__server__ROOT_URL: https://${GITEA_HOST:-gitea.local}/
      GITEA__server__SSH_DOMAIN: ${GITEA_HOST:-gitea.local}
      # The rootless image has no privileged port 22. Keep its built-in SSH
      # listener at 2222 and publish the installation-selected host port.
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__START_SSH_SERVER: "true"
      # Permit account creation only from the Authentik OIDC source. Native
      # registration remains blocked, including direct /user/sign_up calls.
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      # OIDC is the sole interactive login method; Gitea must not expose a
      # local password form alongside Authentik.
      GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM: "false"
      GITEA__service__ENABLE_BASIC_AUTHENTICATION: "false"
      GITEA__service__ENABLE_PASSKEY_AUTHENTICATION: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__ACCOUNT_LINKING: disabled
      GITEA__oauth2_client__REGISTER_EMAIL_CONFIRM: "false"
      # Users must not see each other or each other's repositories. Anonymous
      # visitors get nothing (health checks use /api/healthz, which is exempt).
      # The DEFAULT_* values only apply to accounts and organizations created
      # after this setting; existing users keep their stored visibility.
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DEFAULT_USER_VISIBILITY: private
      GITEA__service__ALLOWED_USER_VISIBILITY_MODES: limited,private
      GITEA__service__DEFAULT_ORG_VISIBILITY: private
      GITEA__service__DEFAULT_ORG_MEMBER_VISIBLE: "false"
      GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      GITEA__service_0X2E_explore__DISABLE_USERS_PAGE: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__FORCE_PRIVATE: "true"
      GITEA__actions__ENABLED: "false"
      TZ: "${IM_TZ:?IM_TZ is required}"
    secrets:
      - source: ai-stand-gitea-postgres-password
        target: ai-stand-gitea-postgres-password
        uid: "10000"
        gid: "20000"
        mode: 0400
      - source: ai-stand-authentik-gitea-client-secret
        target: ai-stand-authentik-gitea-client-secret
        uid: "10000"
        gid: "20000"
        mode: 0400
    volumes:
      - type: bind
        source: ${STORAGE_ROOT:?STORAGE_ROOT is required}/gitea-data/gitea/data
        target: /var/lib/gitea
      - type: bind
        source: ${STORAGE_ROOT:?STORAGE_ROOT is required}/gitea-data/gitea/config
        target: /etc/gitea
      # Backup invocation is managed externally; this mount keeps every
      # generated archive outside the image and beside the Gitea state.
      - type: bind
        source: ${STORAGE_ROOT:?STORAGE_ROOT is required}/gitea-data/gitea/backups
        target: /backup
    ports:
      # Nginx is the only HTTP/TLS entry point. The installation firewall must
      # restrict this technical host port to loopback/Nginx.
      - target: 3000
        published: ${GITEA_HTTP_PORT:-18082}
        protocol: tcp
        mode: host
      # Git-over-SSH cannot traverse the HTTP proxy. Host SSH remains reserved
      # for administration; Git receives a separate installation-selected port.
      - target: 2222
        published: ${GITEA_SSH_PORT:-2222}
        protocol: tcp
        mode: host
    networks:
      ai-gitea-control:
        aliases:
          - gitea
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1:3000/api/healthz
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.ai-stand.gitea == true
      restart_policy:
        condition: any
        delay: 15s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        monitor: 10m
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 15s
        monitor: 10m
        order: stop-first

networks:
  ai-gitea-control:
    driver: overlay
    attachable: false
    driver_opts:
      encrypted: "true"

secrets:
  ai-stand-gitea-postgres-password:
    external: true
  ai-stand-authentik-gitea-client-secret:
    external: true
