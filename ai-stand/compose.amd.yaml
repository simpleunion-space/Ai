services:
  # Per-GFX native HIP builds, with no compatibility spoof or fallback.
  llamacpp01:
    image: ${LLAMACPP01_RUNTIME_IMAGE:?LLAMACPP01_RUNTIME_IMAGE is required}
    environment:
      AI_SUPPLEMENTAL_GIDS: "44:993"
      AMD_VISIBLE_DEVICES: all
      LLAMACPP_ACCELERATOR: amd
      LLAMACPP_GPU_LAYERS: all
      LLAMACPP_REQUIRE_GPU: "1"
      LLAMACPP_GFX: ${AI01_ROCM_GFX_VERSION:?AI01_ROCM_GFX_VERSION is required}

  llamacpp02:
    image: ${LLAMACPP02_RUNTIME_IMAGE:?LLAMACPP02_RUNTIME_IMAGE is required}
    environment:
      AI_SUPPLEMENTAL_GIDS: "44:993"
      AMD_VISIBLE_DEVICES: all
      LLAMACPP_ACCELERATOR: amd
      LLAMACPP_GPU_LAYERS: all
      LLAMACPP_REQUIRE_GPU: "1"
      LLAMACPP_GFX: ${AI02_ROCM_GFX_VERSION:?AI02_ROCM_GFX_VERSION is required}
