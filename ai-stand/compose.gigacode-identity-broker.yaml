# Internal signer for the per-subscription GigaCode plane.  It contains no
# Device ID and publishes no port; the user-scoped bridge services are
# generated later by the reconciler.
services:
  # The only Open WebUI capability that can issue personal GigaCode JWTs is
  # the managed Pipe installed by apply.sh. It obtains this caller credential
  # from a read-only Secret mount; users and browser requests never see it.
  openwebui:
    secrets:
      - source: ai-stand-gigacode-broker-openwebui-caller
        target: ai-stand-gigacode-broker-openwebui-caller
        mode: 0444

  # Agentgateway validates the broker-signed subject token before choosing a
  # dynamic per-subscription bridge. The public key is harmless alone but is
  # kept a Docker Secret so the rendered route configuration can refer to one
  # stable, mounted path.
  agentgateway:
    secrets:
      - source: ai-stand-gigacode-broker-public-jwks-v2
        target: ai-stand-gigacode-broker-public-jwks-v2
        mode: 0444

  gigacode-identity-broker:
    image: ai-stand-gigacode-identity-broker:2026.09.21-1
    user: "10000:20000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_URLS: http://+:8080
      GIGACODE_IDENTITY_BROKER_SIGNING_KEY_FILE: /run/secrets/ai-stand-gigacode-broker-signing-key
      GIGACODE_IDENTITY_BROKER_CALLERS_FILE: /run/secrets/ai-stand-gigacode-broker-callers
      TZ: Europe/Moscow
    secrets:
      - source: ai-stand-gigacode-broker-signing-key
        target: ai-stand-gigacode-broker-signing-key
        mode: 0444
      - source: ai-stand-gigacode-broker-callers
        target: ai-stand-gigacode-broker-callers
        mode: 0444
    networks:
      ai-core:
        aliases:
          - gigacode-identity-broker
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.ai-stand.agentgateway == true
      restart_policy:
        condition: any
        delay: 10s

secrets:
  ai-stand-gigacode-broker-signing-key:
    external: true
  ai-stand-gigacode-broker-callers:
    external: true
  ai-stand-gigacode-broker-public-jwks-v2:
    external: true
  ai-stand-gigacode-broker-openwebui-caller:
    external: true
