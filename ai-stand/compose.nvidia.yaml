services:
  llamacpp01:
    image: ${LLAMACPP01_RUNTIME_IMAGE:?LLAMACPP01_RUNTIME_IMAGE is required}
    environment:
      LLAMACPP_ACCELERATOR: nvidia
      LLAMACPP_GPU_LAYERS: all
      LLAMACPP_REQUIRE_GPU: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      placement:
        constraints:
          - node.labels.ai-stand.llamacpp01 == true

  llamacpp02:
    image: ${LLAMACPP02_RUNTIME_IMAGE:?LLAMACPP02_RUNTIME_IMAGE is required}
    environment:
      LLAMACPP_ACCELERATOR: nvidia
      LLAMACPP_GPU_LAYERS: all
      LLAMACPP_REQUIRE_GPU: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      placement:
        constraints:
          - node.labels.ai-stand.llamacpp02 == true
