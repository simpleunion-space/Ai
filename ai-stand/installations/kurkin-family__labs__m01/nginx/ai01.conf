upstream authentik_backend {
    server 127.0.0.1:19001;
}

upstream lmstudio_backend {
    server 127.0.0.1:1234;
}

upstream lmstudio_proxy_backend {
    server 127.0.0.1:11234;
}

upstream openwebui_backend {
    server 127.0.0.1:18080;
}

upstream portainer_backend {
    server 127.0.0.1:9443;
}

upstream metamcp_backend {
    server 127.0.0.1:12008;
}

upstream agentgateway_backend {
    server 127.0.0.1:4000;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name
        authentik.m01.labs.kurkin-family.ru
        lmstudio.m01.labs.kurkin-family.ru
        lmstudio-proxy.m01.labs.kurkin-family.ru
        openwebui.m01.labs.kurkin-family.ru
        portainer.m01.labs.kurkin-family.ru
        metamcp.m01.labs.kurkin-family.ru
        agentgateway.m01.labs.kurkin-family.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    server_name authentik.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    # Vendored Authentik application-tile icons (see install_authentik_icons()
    # in apply.sh) - served as plain static files so Authentik's own app list
    # never depends on an external site or another component's live instance.
    location /app-icons/ {
        alias /mnt/storage/authentik-data/icons/;
    }

    location / {
        proxy_pass http://authentik_backend;
        proxy_redirect http://0.0.0.0:9000/ https://authentik.m01.labs.kurkin-family.ru/;
        # authentik 2026.8+ only trusts these when the peer is in
        # AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS (set to 127.0.0.1/32,::1/128) - without
        # them it can't tell the original request was HTTPS (e.g. OIDC issuer URLs come
        # back as http://, breaking OIDC discovery for Open WebUI/Portainer/OpenClaw).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx only inherits nginx.conf's http-level proxy_set_header
        # defaults when a location sets none of its own - the 3 lines
        # above already opt this location out of that inheritance, so
        # these have to be repeated explicitly or authentik silently sees
        # Host: authentik_backend instead of the real hostname, and loses
        # the real client IP/WebSocket-upgrade headers too.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name lmstudio.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    location / {
        proxy_pass http://lmstudio_backend;
        # A real chat completion can run far longer than nginx's stock 60s
        # (see nginx.conf's own comment on why the old global override was
        # replaced with per-location ones instead of removed outright).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name lmstudio-proxy.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    location / {
        proxy_pass http://lmstudio_proxy_backend;
        # Same reasoning as lmstudio.m01... above.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name openwebui.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    location / {
        proxy_pass http://openwebui_backend;
        # This is the hop a browser's own request actually waits on: Open
        # WebUI's response time is gated by its full internal call chain
        # (agentgateway -> lmstudio-proxy -> lmstudio), which can run far
        # longer than nginx's stock 60s read timeout (see nginx.conf).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name portainer.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    location / {
        proxy_pass https://portainer_backend;
        # Loopback-only backend (127.0.0.1:9443) - proxy_ssl_verify off is
        # intentional here, unlike the cross-node linux01 config which
        # verifies+pins Portainer's cert for the same backend reached over
        # the network.
        proxy_ssl_verify off;
    }
}

server {
    listen 443 ssl;
    server_name metamcp.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    # MetaMCP v2.4.22 leaves its native registration routes reachable even
    # with BOOTSTRAP_DISABLE_REGISTRATION_UI=true. This public ingress must
    # stay single-admin: provisioning bypasses nginx over ai-network, while
    # browsers cannot create accounts through /register or sign-up API routes.
    # The expression deliberately accepts locale, slash and case variants but
    # keeps OIDC callback (/api/auth/oauth2/callback/oidc) and login routes out.
    location ~* ^/+(?:register(?:/+|$)|[^/]+/+register(?:/+|$)|api/+auth/+sign-up(?:/+|$)) {
        return 404;
    }

    location / {
        proxy_pass http://metamcp_backend;
        proxy_http_version 1.1;
        # MCP client endpoints are long-lived SSE/Streamable-HTTP connections -
        # buffering/caching them breaks streaming, and nginx's stock 60s
        # read timeout can otherwise cut a long-lived MCP connection
        # (MetaMCP's own nginx.conf.example recommends this same override).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering "no";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name agentgateway.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    location / {
        proxy_pass http://agentgateway_backend;
        # agentgateway authenticates itself (native OIDC for the ui: admin
        # console, apiKey for the llm: surface) - no auth_request here, same
        # as Portainer. It fronts the same LLM chain as openwebui/
        # openclaw (agentgateway -> lmstudio-proxy -> lmstudio), so it needs
        # the same long timeout for anyone calling its llm: surface directly.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering "no";
    }
}
