upstream openclaw_backend {
    server 127.0.0.1:18789;
}

upstream portainer_remote_backend {
    server ai01.m01.labs.kurkin-family.ru:443;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name
        openclaw.m01.labs.kurkin-family.ru
        portainer.m01.labs.kurkin-family.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    server_name openclaw.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    location / {
        proxy_pass http://openclaw_backend;
        # OpenClaw's own response time is gated by its full internal call
        # chain (agentgateway -> lmstudio-proxy -> lmstudio), which can run
        # far longer than nginx's stock 60s read timeout (see nginx.conf).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name portainer.m01.labs.kurkin-family.ru;
    ssl_certificate /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/m01.labs.kurkin-family.ru/privkey.pem;

    location / {
        proxy_pass https://portainer_remote_backend;
        proxy_set_header Host portainer.m01.labs.kurkin-family.ru;
        proxy_ssl_server_name on;
        proxy_ssl_name portainer.m01.labs.kurkin-family.ru;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
    }
}
