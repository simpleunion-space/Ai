# m01-only browser URL overlay for the optional generic Coder control plane.
# Keep this final in the Compose merge order: Coder needs the real issuer on
# its first start, before apply.sh's runtime drift reconciliation can run.
# No credentials are kept in this profile.

services:
  coder:
    environment:
      CODER_ACCESS_URL: https://coder.m01.labs.kurkin-family.ru
      CODER_OIDC_ISSUER_URL: https://authentik.m01.labs.kurkin-family.ru/application/o/coder/
