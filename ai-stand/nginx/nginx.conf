user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Every location in this repo was a proxy_pass until the /app-icons/
    # ones (see install_authentik_icons() in apply.sh) - the first to
    # actually serve a file by extension, which is what surfaced this
    # missing include: without it every static response fell back to the
    # bare default_type below, and with X-Content-Type-Options: nosniff
    # already set unconditionally further down, a browser won't render an
    # SVG/PNG served as application/octet-stream at all - confirmed live
    # 2026-09-11. /etc/nginx/mime.types normally ships with the nginx.org
    # package but doesn't actually exist in this install (confirmed live -
    # nginx -t fails with ENOENT on it) - vendored as nginx/mime.types in
    # this repo instead (verbatim from nginx's own upstream conf/mime.types)
    # and installed alongside nginx.conf by install_nginx(), rather than
    # depending on the package to provide it. /etc/mime.types (the OS-wide
    # media-types package table) is NOT a substitute despite the name and
    # despite being always present - it's in the unrelated Apache-style
    # "type<TAB>ext ext" format, not nginx's own `types { ... }` block
    # syntax, and fails the same nginx -t with a syntax error instead.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_redirect http://0.0.0.0:9000/ https://authentik.local/;

    # 2026-09-12: the blanket global override this file used to carry
    # (60s/3600s/3600s applied to every proxied route, whether it needed it
    # or not) is gone by explicit decision - nginx's stock defaults
    # (60s/60s/60s) apply here as the baseline. That decision's own
    # reasoning ("the real budget lives at lmstudio-proxy's
    # LMSTUDIO_PROXY_UPSTREAM_TIMEOUT_MS, not duplicated at every hop") only
    # covers the lmstudio-proxy -> lmstudio hop itself, though - it does NOT
    # cover the external hop a browser's own request actually waits on
    # (nginx -> openwebui/openclaw-gateway, whose own response time is
    # gated by their full internal call chain through agentgateway before
    # replying). Reinstated as scoped, per-location overrides instead of a
    # global one: every route that either proxies a real LLM generation
    # (lmstudio, lmstudio-proxy, openwebui, openclaw.local) or carries a
    # long-lived connection of its own (metamcp's MCP sessions, agentgateway
    # fronting the same LLM chain) sets its own proxy_read_timeout/proxy_send_timeout
    # directly in its conf.d location block - see those files. Routes with
    # neither property (authentik, portainer) are intentionally left on the
    # stock default.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # `add_header` is not inherited by a location that defines its own, so
    # any future location-specific headers must repeat these explicitly.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    include /etc/nginx/conf.d/*.conf;
}
