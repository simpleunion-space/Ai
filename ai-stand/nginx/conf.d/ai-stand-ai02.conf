upstream openclaw_backend {
    server 127.0.0.1:18789;
}

# Both remote upstreams are ai01's own nginx, addressed by IP on purpose: nginx
# resolves an upstream NAME at every start and restart, and one DNS hiccup then
# leaves this whole node (openclaw, coder, portainer) down until someone starts
# it again (2026-10-23 09:51 MSK, four services for eight hours). TLS is still
# verified against the real host name through proxy_ssl_name below.
upstream authentik_forward_auth_backend {
    server @AI01_IP@:443;
}
upstream portainer_remote_backend {
    server @AI01_IP@:443;
}

upstream coder_backend {
    server 127.0.0.1:17080;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name
        @OPENCLAW_HOST@
        @CODER_HOST@
        @PORTAINER_HOST@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    # Reject unknown TLS SNI before a forged known Host can select a vhost.
    ssl_reject_handshake on;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    server_name @OPENCLAW_HOST@;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;

    # The Authentik embedded outpost performs forward-auth only. It is not
    # the application proxy: the authenticated request still reaches the
    # loopback-only OpenClaw Gateway through this Nginx server.
    location ^~ /outpost.goauthentik.io/ {
        proxy_pass https://authentik_forward_auth_backend;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name @AUTHENTIK_HOST@;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;

        # The remote ai01 Nginx must receive the Authentik host, while the
        # outpost selects the single-application provider from the immutable
        # external OpenClaw host carried in X-Forwarded-Host.
        proxy_set_header Host @AUTHENTIK_HOST@;
        proxy_set_header X-Forwarded-Host @OPENCLAW_HOST@;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-URL https://@OPENCLAW_HOST@$request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @openclaw_authentik_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=https://@OPENCLAW_HOST@$request_uri;
    }

    location / {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @openclaw_authentik_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        # Every forwarded identity value comes from the Authentik subrequest;
        # client-supplied Authentik, OpenClaw and forwarding headers are
        # overwritten or removed before the Gateway sees the request.
        auth_request_set $authentik_uid $upstream_http_x_authentik_uid;
        # Display data is deliberately obtained only from the trusted
        # Authentik subrequest. The immutable UID remains the only server
        # identity and session key; this value is never used for auth.
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_provider $upstream_http_x_authentik_meta_provider;

        proxy_pass http://openclaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host @OPENCLAW_HOST@;
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host @OPENCLAW_HOST@;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Authentik-Username "";
        proxy_set_header X-Authentik-Groups "";
        proxy_set_header X-Authentik-Entitlements "";
        proxy_set_header X-Authentik-Email "";
        proxy_set_header X-Authentik-Name "";
        proxy_set_header X-AI-Stand-Display-Name $authentik_username;
        proxy_set_header X-Authentik-Uid $authentik_uid;
        proxy_set_header X-Authentik-Meta-Provider $authentik_provider;
        proxy_set_header X-OpenClaw-User "";
        # OpenClaw's own response time is gated by its full internal call
        # chain (agentgateway -> model proxy -> llama.cpp), which can run
        # far longer than nginx's stock 60s read timeout (see nginx.conf).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
server {
    listen 443 ssl;
    server_name @PORTAINER_HOST@;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;

    location / {
        proxy_pass https://portainer_remote_backend;
        proxy_set_header Host @PORTAINER_HOST@;
        proxy_ssl_server_name on;
        proxy_ssl_name @PORTAINER_HOST@;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
    }
}

server {
    listen 443 ssl;
    server_name @CODER_HOST@;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;

    # Coder performs its own Authentik OIDC authorization-code flow. This
    # proxy deliberately adds no forward-auth identity header and exposes
    # only the loopback technical listener of the ai02-pinned service.
    location / {
        proxy_pass http://coder_backend;
        proxy_http_version 1.1;
        proxy_set_header Host @CODER_HOST@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
