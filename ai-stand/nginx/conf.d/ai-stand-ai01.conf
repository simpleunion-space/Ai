upstream authentik_backend {
    server 127.0.0.1:19001;
}

upstream openwebui_backend {
    server 127.0.0.1:18080;
}

upstream portainer_backend {
    server 127.0.0.1:9443;
}

upstream agentgateway_backend {
    server 127.0.0.1:4000;
}

upstream gitea_backend {
    server 127.0.0.1:18082;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name
        @AUTHENTIK_HOST@
        @OPENWEBUI_HOST@
        @PORTAINER_HOST@
        @AGENTGATEWAY_HOST@
        @GITEA_HOST@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    # Reject unknown TLS SNI before a forged known Host can select a vhost.
    ssl_reject_handshake on;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    server_name @AUTHENTIK_HOST@;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;

    # Vendored Authentik application-tile icons (see install_authentik_icons()
    # in apply.sh) - served as plain static files so Authentik's own app list
    # never depends on an external site or another component's live instance.
    location /app-icons/ {
        alias @STORAGE_ROOT@/authentik-data/icons/;
    }

    # OpenClaw lives behind Nginx on ai02, while Authentik and its
    # embedded outpost live here.  The outpost selects a forward-auth
    # provider by X-Forwarded-Host, so the normal Authentik UI proxy below
    # must not overwrite the OpenClaw value. Limit this bridge to ai02:
    # no external client can use the Authentik FQDN to manufacture an
    # outpost response for an arbitrary host or path.
    location ^~ /outpost.goauthentik.io/ {
        allow @AI02_IP@;
        deny all;

        proxy_pass http://authentik_backend;
        proxy_redirect http://0.0.0.0:9000/ https://@AUTHENTIK_HOST@/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URL $http_x_original_url;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://authentik_backend;
        proxy_redirect http://0.0.0.0:9000/ https://@AUTHENTIK_HOST@/;
        # authentik 2026.8+ only trusts these when the peer is in
        # AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS (set to 127.0.0.1/32,::1/128) - without
        # them it can't tell the original request was HTTPS (e.g. OIDC issuer URLs come
        # back as http://, breaking OIDC discovery for Open WebUI/Portainer/OpenClaw).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx only inherits nginx.conf's http-level proxy_set_header
        # defaults when a location sets none of its own - the 3 lines
        # above already opt this location out of that inheritance, so
        # these have to be repeated explicitly or authentik silently sees
        # Host: authentik_backend instead of the real hostname, and loses
        # the real client IP/WebSocket-upgrade headers too.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name @GITEA_HOST@;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;
    client_max_body_size 1g;

    # Gitea owns its native Authentik OIDC authorization-code flow. Nginx
    # provides TLS only and passes the original public origin faithfully.
    location / {
        proxy_pass http://gitea_backend;
        proxy_http_version 1.1;
        proxy_set_header Host @GITEA_HOST@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name @OPENWEBUI_HOST@;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;

    location / {
        proxy_pass http://openwebui_backend;
        # This is the hop a browser's own request actually waits on: Open
        # WebUI's response time is gated by its full internal call chain
        # (agentgateway -> model proxy -> llama.cpp), which can run far
        # longer than nginx's stock 60s read timeout (see nginx.conf).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name @PORTAINER_HOST@;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;

    location / {
        proxy_pass https://portainer_backend;
        # Loopback-only backend (127.0.0.1:9443) - proxy_ssl_verify off is
        # intentional here, unlike the cross-node ai02 config which
        # verifies+pins Portainer's cert for the same backend reached over
        # the network.
        proxy_ssl_verify off;
    }
}

server {
    listen 443 ssl;
    server_name @AGENTGATEWAY_HOST@;
    ssl_certificate @CERT_DIR@/fullchain.pem;
    ssl_certificate_key @CERT_DIR@/privkey.pem;

    location / {
        proxy_pass http://agentgateway_backend;
        # Agentgateway derives OAuth issuer and protected-resource metadata
        # from the public request origin.  Preserve it instead of leaking the
        # internal upstream name into OAuth discovery documents.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # agentgateway authenticates itself (native OIDC for the ui: admin
        # console, apiKey for the llm: surface) - no auth_request here, same
        # as Portainer. It fronts the same LLM chain as openwebui/
        # openclaw (agentgateway -> model proxy -> llama.cpp), so it needs
        # the same long timeout for anyone calling its llm: surface directly.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering "no";
    }
}
