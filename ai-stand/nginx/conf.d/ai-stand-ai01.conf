upstream authentik_backend {
    server 127.0.0.1:19001;
}

upstream lmstudio_backend {
    server 127.0.0.1:1234;
}

upstream lmstudio_proxy_backend {
    server 127.0.0.1:11234;
}

upstream openwebui_backend {
    server 127.0.0.1:18080;
}

upstream portainer_backend {
    server 127.0.0.1:9443;
}

upstream metamcp_backend {
    server 127.0.0.1:12008;
}

upstream agentgateway_backend {
    server 127.0.0.1:4000;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name authentik.local lmstudio.local lmstudio-proxy.local openwebui.local portainer.local metamcp.local agentgateway.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /mnt/storage/certbot-data/live/local/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/local/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    server_name authentik.local;
    ssl_certificate /mnt/storage/certbot-data/live/local/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/local/privkey.pem;

    # Vendored Authentik application-tile icons (see install_authentik_icons()
    # in apply.sh) - served as plain static files so Authentik's own app list
    # never depends on an external site or another component's live instance.
    location /app-icons/ {
        alias /mnt/storage/authentik-data/icons/;
    }

    location / {
        proxy_pass http://authentik_backend;
        proxy_redirect http://0.0.0.0:9000/ https://authentik.local/;
    }
}

server {
    listen 443 ssl;
    server_name lmstudio.local;
    ssl_certificate /mnt/storage/certbot-data/live/local/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/local/privkey.pem;

    location / {
        proxy_pass http://lmstudio_backend;
        # A real chat completion can run far longer than nginx's stock 60s
        # (see nginx.conf's own comment on why the old global override was
        # replaced with per-location ones instead of removed outright).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name lmstudio-proxy.local;
    ssl_certificate /mnt/storage/certbot-data/live/local/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/local/privkey.pem;

    location / {
        proxy_pass http://lmstudio_proxy_backend;
        # Same reasoning as lmstudio.local above.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name openwebui.local;
    ssl_certificate /mnt/storage/certbot-data/live/local/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/local/privkey.pem;

    location / {
        proxy_pass http://openwebui_backend;
        # This is the hop a browser's own request actually waits on: Open
        # WebUI's response time is gated by its full internal call chain
        # (agentgateway -> lmstudio-proxy -> lmstudio), which can run far
        # longer than nginx's stock 60s read timeout (see nginx.conf).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    server_name portainer.local;
    ssl_certificate /mnt/storage/certbot-data/live/local/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/local/privkey.pem;

    location / {
        proxy_pass https://portainer_backend;
        # Loopback-only backend (127.0.0.1:9443) - proxy_ssl_verify off is
        # intentional here, unlike the cross-node linux01 config which
        # verifies+pins Portainer's cert for the same backend reached over
        # the network.
        proxy_ssl_verify off;
    }
}

server {
    listen 443 ssl;
    server_name metamcp.local;
    ssl_certificate /mnt/storage/certbot-data/live/local/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/local/privkey.pem;

    location / {
        proxy_pass http://metamcp_backend;
        proxy_http_version 1.1;
        # MCP client endpoints are long-lived SSE/Streamable-HTTP
        # connections - nginx's stock 60s read timeout can otherwise cut
        # one (MetaMCP's own nginx.conf.example recommends this override).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering "no";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name agentgateway.local;
    ssl_certificate /mnt/storage/certbot-data/live/local/fullchain.pem;
    ssl_certificate_key /mnt/storage/certbot-data/live/local/privkey.pem;

    location / {
        proxy_pass http://agentgateway_backend;
        # agentgateway authenticates itself (native OIDC for the ui: admin
        # console, apiKey for the llm: surface) - no auth_request here, same
        # as Portainer. It fronts the same LLM chain as openwebui/
        # openclaw (agentgateway -> lmstudio-proxy -> lmstudio), so it needs
        # the same long timeout for anyone calling its llm: surface directly.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering "no";
    }
}
